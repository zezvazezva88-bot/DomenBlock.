
name: Build DomenBlock APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: unzip -q DomenBlock-phone-build.zip

      - name: Build APK
        working-directory: DomenBlock
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DomenBlock-APK
          path: DomenBlock/app/build/outputs/apk/debug/app-debug.apk
